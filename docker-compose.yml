services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]

  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile }
    ports: ["8000:8000"]
    environment:
      FRAUD_THRESHOLD: "0.5"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]

volumes:
  mlflow-data:
