name: ml-ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Validate data and train (with model gate)
        run: make train
      - name: Test API
        run: make test
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with: { name: model, path: models/ }
      - name: Build image
        run: make docker
      - name: Scan image (DevSecOps)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            fraud-api:local
